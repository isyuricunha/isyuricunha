name: update readme and create releases

on:
  # scheduled readme updates every 24 hours (daily at midnight utc)
  schedule:
    - cron: "0 0 * * 0"
  
  # manual readme update trigger
  workflow_dispatch:
  
  # create release only when a version tag is pushed
  push:
    tags:
      - "v*.*.*"

jobs:
  # job that runs on schedule to update the readme with a new quote
  update-readme:
    # only run on schedule or manual trigger, not on tag push
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: setup python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: generate quote via ella
        id: ella
        uses: isyuricunha/ella@v1.10.1
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        with:
          ella_app_client_id: ${{ secrets.ELLA_APP_CLIENT_ID }}
          ella_app_private_key: ${{ secrets.ELLA_APP_PRIVATE_KEY }}
        env:
          ELLA_AI_API_KEY: ${{ secrets.ELLA_AI_API_KEY }}
          ELLA_AI_BASE_URL: ${{ secrets.ELLA_AI_BASE_URL }}
          ELLA_AI_MODEL: ${{ secrets.ELLA_AI_MODEL }}
          YURI_COMMIT_NAME: ${{ secrets.YURI_COMMIT_NAME }}
          YURI_COMMIT_EMAIL: ${{ secrets.YURI_COMMIT_EMAIL }}
          GITHUB_EVENT_NAME: schedule

      - name: fallback - random quote from drive
        if: steps.ella.outcome == 'failure' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: python update_readme.py

      - name: commit and push changes
        run: |
          git config user.name "${GITHUB_ACTOR}"
          git config user.email "${GITHUB_ACTOR}@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "update week quote" && git push)

  # job that runs when a version tag is pushed to create a release
  create-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v7

      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
